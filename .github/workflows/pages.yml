name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test backend and simulation
        run: |
          python3 -m unittest discover -s tests -v
          node --check web/app.js
          node tests/test_demo.cjs
      - name: Set backend URL
        env:
          AGENT_API_BASE: ${{ vars.AGENT_API_BASE }}
        run: python -c 'import json,os,pathlib; pathlib.Path("web/config.js").write_text("window.AGENT_API_BASE = " + json.dumps(os.environ.get("AGENT_API_BASE", "")) + ";\n")'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check public assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          base=os.environ['SITE_URL']
          for filename in ['', 'styles.css', 'app.js', 'demo.js', 'config.js']:
              with urllib.request.urlopen(base+filename, timeout=30) as response:
                  assert response.status == 200
                  assert len(response.read()) > 0
                  print('HTTP 200', filename or 'index.html')
          PY
