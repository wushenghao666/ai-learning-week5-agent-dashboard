services:
  - type: web
    name: ai-learning-week5-agent
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.web --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AGENT_ALLOWED_ORIGIN
        sync: false
